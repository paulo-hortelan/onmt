name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Composer blocks the legacy Laravel 10/11 releases used in these compatibility checks.
          - os: ubuntu-latest
            php: '8.1'
            laravel: 10.*
            testbench: 8.*
            carbon: '^2.67'
            stability: prefer-lowest
            security: --no-security-blocking
          - os: windows-latest
            php: '8.3'
            laravel: 10.*
            testbench: 8.*
            carbon: '^2.67'
            stability: prefer-stable
            security: --no-security-blocking
          - os: ubuntu-latest
            php: '8.2'
            laravel: 11.*
            testbench: 9.*
            carbon: '^2.67|^3.0'
            stability: prefer-lowest
            security: --no-security-blocking
          - os: windows-latest
            php: '8.3'
            laravel: 11.*
            testbench: 9.*
            carbon: '^2.67|^3.0'
            stability: prefer-stable
            security: --no-security-blocking
          - os: ubuntu-latest
            php: '8.2'
            laravel: 12.*
            testbench: 10.*
            carbon: '^3.8.4'
            stability: prefer-lowest
          - os: windows-latest
            php: '8.3'
            laravel: 12.*
            testbench: 10.*
            carbon: '^3.8.4'
            stability: prefer-stable
          - os: ubuntu-latest
            php: '8.3'
            laravel: 13.*
            testbench: 11.*
            carbon: '^3.8.4'
            stability: prefer-lowest
          - os: windows-latest
            php: '8.3'
            laravel: 13.*
            testbench: 11.*
            carbon: '^3.8.4'
            stability: prefer-stable

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-stable ${{ matrix.security }} --prefer-dist --no-interaction --no-progress

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage tests/Telnet tests/Datacom/ServicePortNewCommandTest.php tests/CommandResultBatchTest.php tests/Nokia/InterfaceOntsDetailParsingTest.php tests/Nokia/PonAndXPonInterfaceParsingTest.php tests/Nokia/UnregisteredParsingTest.php tests/Nokia/XPonInterfaceParsingTest.php tests/ZTE/CommandExecutionTest.php
